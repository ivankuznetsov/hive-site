{%- comment -%}
  Pagefind search UI. The /pagefind/ bundle is generated by `pagefind --site _site`
  in the deploy workflow (after Jekyll builds), so these assets don't exist during
  a bare `jekyll build` — the widget simply stays empty until the index is present.
{%- endcomment -%}
<link rel="stylesheet" href="{{ '/pagefind/pagefind-ui.css' | relative_url }}">
<div id="pagefind-search" class="pagefind-search"></div>
<script src="{{ '/pagefind/pagefind-ui.js' | relative_url }}"></script>
<script>
  window.addEventListener("DOMContentLoaded", function () {
    if (typeof PagefindUI === "undefined") { return; }
    new PagefindUI({
      element: "#pagefind-search",
      showSubResults: true,
      showImages: false,
      excerptLength: 15,
      placeholder: "Search the docs",
    });
  });
</script>
