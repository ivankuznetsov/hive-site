title: Hive
description: >-
  Turn a rough idea into a merge-ready pull request — a multi-agent pipeline you
  watch as it works and can step into at any stage.
lang: en

# Custom domain (GitHub Pages). Served at the root, so baseurl is empty.
url: "https://hivecli.sh"
baseurl: ""

# Latest published release — bump here; landing + getting-started read it.
hive_version: "0.2.4"

theme: just-the-docs

# The sidebar logo is rendered inline by _includes/title.html (honey mark +
# wordmark) so it stays visible in both color schemes — no `logo:` needed.

# Clean trailing-slash URLs: /docs/getting-started/ etc.
permalink: pretty

# Search is provided by Pagefind (built post-Jekyll in the deploy workflow),
# not Just the Docs' bundled lunr index.
search_enabled: false

# Dark by default for a terminal-tool aesthetic; a toggle is wired in the docs layout.
color_scheme: dark

# Just the Docs niceties
enable_copy_code_button: true
heading_anchors: true

# Footer + external nav
nav_external_links:
  - title: GitHub
    url: https://github.com/ivankuznetsov/hive
  - title: Discord
    url: https://discord.gg/Qg5E7rMt

aux_links:
  GitHub: https://github.com/ivankuznetsov/hive
  Discord: https://discord.gg/Qg5E7rMt
aux_links_new_tab: true

# The marketing landing page is not part of the docs sidebar.
# (index.md sets nav_exclude + layout: home directly.)

back_to_top: true
back_to_top_text: "Back to top"

footer_content: >-
  Hive is MIT licensed. Built by Hive itself.

# SEO (jekyll-seo-tag): social/org metadata. The default share image is set
# per-page via `defaults` below (seo-tag reads page.image, not site.image).
social:
  name: Hive
  links:
    - https://github.com/ivankuznetsov/hive
    - https://discord.gg/Qg5E7rMt

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Default front matter
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/og-image.png   # default OG/Twitter share card
  - scope:
      path: "docs"
      type: pages
    values:
      layout: default

# Cloudflare Pages config files are underscore-prefixed; force them into _site.
include:
  - _headers
  - _redirects

exclude:
  - wrangler.jsonc
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - package.json
  - package-lock.json
  - README.md
  - LICENSE
  - .github
  - script

# jekyll-sitemap / SEO
sass:
  style: compressed
