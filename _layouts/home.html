<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
{% include landing_head.html %}
<body class="landing">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Hive home">
        {% include logo.svg %}
        <span class="brand__name">Hive</span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ '/docs/concepts/' | relative_url }}">Concepts</a>
        <a href="{{ '/docs/' | relative_url }}">Docs</a>
        <a class="nav-icon-link" href="https://github.com/ivankuznetsov/hive">{% include icons/github.svg %}<span>GitHub</span></a>
        <a class="nav-icon-link" href="https://discord.gg/Qg5E7rMt">{% include icons/discord.svg %}<span>Discord</span></a>
        <a class="btn btn--primary btn--small" href="#install">{% include icons/download.svg %}<span>Install</span></a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  {% include landing/footer.html %}
</body>
</html>
