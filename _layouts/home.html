<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
{% include landing_head.html %}
<body class="landing">
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="wrap site-header__inner">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Hive home">
        {% include logo.svg %}
        <span class="brand__name">Hive</span>
      </a>
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ '/' | relative_url }}#proof">Proof</a>
        <a href="{{ '/' | relative_url }}#pillars">Pillars</a>
        <a href="{{ '/' | relative_url }}#paths">Workflows</a>
        <a href="{{ '/build/' | relative_url }}">Build</a>
        <a href="{{ '/content/' | relative_url }}">Content</a>
        <a href="{{ '/honeycombs/' | relative_url }}">Honeycombs</a>
        <a href="{{ '/docs/' | relative_url }}">Docs</a>
        <a class="nav-icon-link" href="https://github.com/ivankuznetsov/hive">{% include icons/github.svg %}<span>GitHub</span></a>
        <a class="site-nav__action" href="{{ '/' | relative_url }}#install">Install</a>
      </nav>
    </div>
  </header>

  <main id="main">
    {{ content }}
  </main>

  {% include landing/footer.html %}
</body>
</html>
