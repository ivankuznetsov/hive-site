cells:
  - dimension_id: "product_scope"
    product_id: "hive"
    support_status: "documented"
    claim: "A general-purpose, local-first workflow engine: coding is the flagship workflow, alongside content, benchmark, installed Honeycombs, and workflows users author themselves."
    claim_type: "fact"
    scope: "product"
    source_ids: ["hive_repo", "hive_custom_workflows"]
  - dimension_id: "product_scope"
    product_id: "agentico"
    support_status: "documented"
    claim: "An AI development workflow orchestrator designed to carry a software feature from a high-level request through research, planning, implementation, review, and pull request publication."
    claim_type: "fact"
    scope: "product"
    source_ids: ["agentico_repo", "agentico_announcement"]
  - dimension_id: "product_scope"
    product_id: "omnigent"
    support_status: "documented"
    claim: "An open-source AI agent framework and meta-harness that provides a common orchestration layer for coding agents and custom agents."
    claim_type: "fact"
    scope: "product"
    source_ids: ["omnigent_repo", "omnigent_harnesses"]

  - dimension_id: "workflow_state"
    product_id: "hive"
    support_status: "documented"
    claim: "A task is a directory, its stage-folder location is its state, and each stage writes durable artifacts and markers for the next transition."
    claim_type: "fact"
    scope: "product"
    source_ids: ["hive_concepts"]
  - dimension_id: "workflow_state"
    product_id: "agentico"
    support_status: "documented"
    claim: "Features move through a profile-dependent, checkpoint-driven lifecycle; structured artifacts, roadmap phases, and progress files carry context between sessions."
    claim_type: "fact"
    scope: "product"
    source_ids: ["agentico_repo", "agentico_announcement"]
  - dimension_id: "workflow_state"
    product_id: "omnigent"
    support_status: "documented"
    claim: "The server persists conversation, message, and tool-call history, while each harness keeps its native agent loop and Omnigent layers shared session controls around it."
    claim_type: "fact"
    scope: "product"
    source_ids: ["omnigent_harnesses", "omnigent_deployment"]

  - dimension_id: "harnesses_providers"
    product_id: "hive"
    support_status: "documented"
    claim: "Stages and reviewers can be assigned across Claude, Codex, Grok, and Pi, with project configuration recording the selected agents and models."
    claim_type: "fact"
    scope: "product"
    source_ids: ["hive_repo", "hive_configuration"]
  - dimension_id: "harnesses_providers"
    product_id: "agentico"
    support_status: "documented"
    claim: "Claude, Codex, and OpenCode are co-equal provider CLIs; one can run the workflow or roles can be split and overridden by phase."
    claim_type: "fact"
    scope: "product"
    source_ids: ["agentico_repo"]
  - dimension_id: "harnesses_providers"
    product_id: "omnigent"
    support_status: "documented"
    claim: "Direct and native harnesses cover multiple coding-agent runtimes; changing the harness preserves shared tools, policies, prompts, and models, and custom ACP agents can be registered."
    claim_type: "fact"
    scope: "product"
    source_ids: ["omnigent_harnesses"]

  - dimension_id: "planning_review"
    product_id: "hive"
    support_status: "documented"
    claim: "The bundled coding workflow moves through brainstorm, plan, execute, pull-request creation, autonomous multi-reviewer hardening, artifact capture, and finalize stages."
    claim_type: "fact"
    scope: "included_workflow"
    scope_label: "Hive coding workflow"
    source_ids: ["hive_repo", "hive_concepts"]
  - dimension_id: "planning_review"
    product_id: "agentico"
    support_status: "documented"
    claim: "Every profile plans roadmap phases and runs Final Review; deeper profiles add inquiry, research, design, plan critics, and implementation-time review gates."
    claim_type: "fact"
    scope: "product"
    source_ids: ["agentico_repo"]
  - dimension_id: "planning_review"
    product_id: "omnigent"
    support_status: "documented"
    claim: "Polly decomposes a coding goal into sub-tasks, delegates implementation, and sends the diff to a different-vendor reviewer with fix loops for blocking issues."
    claim_type: "fact"
    scope: "included_workflow"
    scope_label: "Omnigent Polly workflow"
    source_ids: ["omnigent_polly"]

  - dimension_id: "repository_context"
    product_id: "hive"
    support_status: "documented"
    claim: "Project-local state retains the original request, stage artifacts, logs, review records, configuration, and feature-worktree pointer so later stages can read the trail directly."
    claim_type: "fact"
    scope: "product"
    source_ids: ["hive_concepts", "hive_configuration"]
  - dimension_id: "repository_context"
    product_id: "agentico"
    support_status: "documented"
    claim: "A per-repository knowledge base records architecture, conventions, APIs, dependencies, and verification commands, then refreshes when repository HEAD changes."
    claim_type: "fact"
    scope: "product"
    source_ids: ["agentico_repo"]
  - dimension_id: "repository_context"
    product_id: "omnigent"
    support_status: "documented"
    claim: "Project and user configuration select harness behavior, while native and ACP harnesses retain their own agent loops, tools, credentials, and context windows inside Omnigent sessions."
    claim_type: "fact"
    scope: "product"
    source_ids: ["omnigent_harnesses"]

  - dimension_id: "isolation"
    product_id: "hive"
    support_status: "documented"
    claim: "Execute creates a feature worktree and records its pointer before implementation begins."
    claim_type: "fact"
    scope: "included_workflow"
    scope_label: "Hive coding workflow"
    source_ids: ["hive_concepts"]
  - dimension_id: "isolation"
    product_id: "agentico"
    support_status: "documented"
    claim: "Each feature receives isolated worktrees, branches, sessions, and artifacts; a multi-repository feature receives one worktree per target repository."
    claim_type: "fact"
    scope: "product"
    source_ids: ["agentico_repo", "agentico_announcement"]
  - dimension_id: "isolation"
    product_id: "omnigent"
    support_status: "documented"
    claim: "Each Polly implementation sub-task runs in its own harness and git worktree, with a worktree guard available to contain writes."
    claim_type: "fact"
    scope: "included_workflow"
    scope_label: "Omnigent Polly workflow"
    source_ids: ["omnigent_polly", "omnigent_policies"]

  - dimension_id: "multi_repository_delivery"
    product_id: "hive"
    support_status: "not_documented"
    scope: "product"
    reviewed_on: "2026-08-12"
    reviewed_source_ids: ["hive_repo", "hive_concepts", "hive_custom_workflows", "hive_configuration", "hive_operating"]
  - dimension_id: "multi_repository_delivery"
    product_id: "agentico"
    support_status: "documented"
    claim: "A feature can target several repositories, order implementation by cross-repository dependencies, and create cross-referenced pull requests."
    claim_type: "fact"
    scope: "product"
    source_ids: ["agentico_repo"]
  - dimension_id: "multi_repository_delivery"
    product_id: "omnigent"
    support_status: "not_documented"
    scope: "product"
    reviewed_on: "2026-08-12"
    reviewed_source_ids: ["omnigent_repo", "omnigent_harnesses", "omnigent_polly"]

  - dimension_id: "policy_sandboxing"
    product_id: "hive"
    support_status: "documented"
    claim: "Project settings choose agent permission modes; Hivebox is the documented container distribution for untrusted agents, reproducible hosts, or multiple isolated instances."
    claim_type: "fact"
    scope: "product"
    source_ids: ["hive_repo", "hive_configuration", "hive_operating"]
  - dimension_id: "policy_sandboxing"
    product_id: "agentico"
    support_status: "not_documented"
    scope: "product"
    reviewed_on: "2026-08-12"
    reviewed_source_ids: ["agentico_repo", "agentico_announcement"]
  - dimension_id: "policy_sandboxing"
    product_id: "omnigent"
    support_status: "documented"
    claim: "Contextual policies can allow, ask, or deny tool actions, and built-in policy can enforce OS sandbox read, write, and network limits within documented platform boundaries."
    claim_type: "fact"
    scope: "product"
    source_ids: ["omnigent_policies", "omnigent_os_sandbox"]

  - dimension_id: "collaboration_ui"
    product_id: "hive"
    support_status: "documented"
    claim: "A local TUI and native web dashboard expose the same registered projects and workflow state; optional Telegram control supports status, queue, and approvals."
    claim_type: "fact"
    scope: "product"
    source_ids: ["hive_repo", "hive_operating"]
  - dimension_id: "collaboration_ui"
    product_id: "agentico"
    support_status: "documented"
    claim: "The desktop app is the primary interface, with a dashboard for concurrent features, checkpoints, help requests, review, and publishing decisions."
    claim_type: "fact"
    scope: "product"
    source_ids: ["agentico_repo", "agentico_announcement"]
  - dimension_id: "collaboration_ui"
    product_id: "omnigent"
    support_status: "documented"
    claim: "Multi-user sessions work across terminal, web, mobile, and desktop; teammates can watch, co-drive, or fork a conversation with server-controlled sharing permissions."
    claim_type: "fact"
    scope: "product"
    source_ids: ["omnigent_repo", "omnigent_collaboration"]

  - dimension_id: "durability_recovery"
    product_id: "hive"
    support_status: "documented"
    claim: "Filesystem state, stage markers, locks, and retained artifacts let the daemon or an operator resume from an explicit task state after interruptions."
    claim_type: "fact"
    scope: "product"
    source_ids: ["hive_repo", "hive_concepts", "hive_operating"]
  - dimension_id: "durability_recovery"
    product_id: "agentico"
    support_status: "documented"
    claim: "The persisted state machine, progress files, session management, and crash recovery are designed to continue work across fresh agent contexts and process interruptions."
    claim_type: "fact"
    scope: "product"
    source_ids: ["agentico_repo", "agentico_announcement"]
  - dimension_id: "durability_recovery"
    product_id: "omnigent"
    support_status: "documented"
    claim: "The server persists conversations, messages, and tool calls in SQLite or Postgres so sessions can remain available across interfaces and deployed hosts."
    claim_type: "fact"
    scope: "product"
    source_ids: ["omnigent_repo", "omnigent_deployment"]

  - dimension_id: "extensibility"
    product_id: "hive"
    support_status: "documented"
    claim: "Users define ordered stages in YAML, author project-local workflows, or install reviewed Honeycomb workflow packages."
    claim_type: "fact"
    scope: "product"
    source_ids: ["hive_repo", "hive_custom_workflows"]
  - dimension_id: "extensibility"
    product_id: "agentico"
    support_status: "documented"
    claim: "Configuration selects pipeline depth, verification commands, provider availability, and per-phase models within the feature lifecycle."
    claim_type: "fact"
    scope: "product"
    source_ids: ["agentico_repo"]
  - dimension_id: "extensibility"
    product_id: "omnigent"
    support_status: "documented"
    claim: "Users can define agents in YAML, register custom ACP agents, install community harness plugins, and add custom policies."
    claim_type: "fact"
    scope: "product"
    source_ids: ["omnigent_repo", "omnigent_harnesses", "omnigent_policies"]

  - dimension_id: "deployment"
    product_id: "hive"
    support_status: "documented"
    claim: "Hive runs locally as a CLI with user services and a loopback web UI; Hivebox supplies a containerized server or NAS option."
    claim_type: "fact"
    scope: "product"
    source_ids: ["hive_repo", "hive_operating"]
  - dimension_id: "deployment"
    product_id: "agentico"
    support_status: "documented"
    claim: "The desktop app supervises a matched server locally; the CLI can run a headless server and the desktop app can attach to a remote server."
    claim_type: "fact"
    scope: "product"
    source_ids: ["agentico_repo", "agentico_remote_servers"]
  - dimension_id: "deployment"
    product_id: "omnigent"
    support_status: "documented"
    claim: "The server can run locally or through documented Docker Compose, cloud-platform, managed-service, and Kubernetes deployment paths."
    claim_type: "fact"
    scope: "product"
    source_ids: ["omnigent_repo", "omnigent_deployment"]

  - dimension_id: "ideal_use_cases"
    product_id: "hive"
    support_status: "documented"
    claim: "Choose Hive for durable, inspectable workflows whose stages should remain editable and reusable across software delivery, writing, research, audits, or operations."
    claim_type: "positioning_interpretation"
    scope: "product"
    source_ids: ["hive_repo", "hive_concepts", "hive_custom_workflows"]
  - dimension_id: "ideal_use_cases"
    product_id: "agentico"
    support_status: "documented"
    claim: "Choose Agentico for complex software features that benefit from a prescribed context-to-plan-to-review lifecycle, parallel feature isolation, and multi-repository pull-request delivery."
    claim_type: "positioning_interpretation"
    scope: "product"
    source_ids: ["agentico_repo", "agentico_announcement"]
  - dimension_id: "ideal_use_cases"
    product_id: "omnigent"
    support_status: "documented"
    claim: "Choose Omnigent when several harnesses, shared governance, live collaboration, or deployable agent infrastructure matter more than one prescribed coding lifecycle."
    claim_type: "positioning_interpretation"
    scope: "product"
    source_ids: ["omnigent_repo", "omnigent_harnesses", "omnigent_policies", "omnigent_collaboration", "omnigent_deployment"]

excluded_topics:
  - id: "pricing"
    label: "Pricing"
    reason: "Provider, subscription, and infrastructure costs are not defined on an equivalent basis."
  - id: "performance_superiority"
    label: "Performance superiority"
    reason: "No shared first-party benchmark covers the same tasks, settings, and outcome measure."
  - id: "popularity_adoption"
    label: "Popularity or adoption"
    reason: "Repository and social counts do not establish product fit."
  - id: "security_quality"
    label: "Security quality"
    reason: "Documented controls are compared as product boundaries, not scored as assurance."
  - id: "reliability"
    label: "Reliability"
    reason: "Recovery mechanisms are documented, but no equivalent operational reliability evidence is available."
  - id: "roadmap"
    label: "Roadmap"
    reason: "Future intent is not treated as a shipped capability."
