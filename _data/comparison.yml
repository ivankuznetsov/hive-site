schema: "hive-site-comparison/v1"
reviewed_on: "2026-08-12"

page:
  eyebrow: "Agent orchestrator comparison"
  heading: "Choose by product boundary, not a universal score"
  introduction: "Hive, Agentico, and Omnigent address related orchestration problems from different starting points. This comparison maps their documented boundaries and tradeoffs so you can choose the approach that fits the work. It does not name a generic winner."
  summary_heading: "Three distinct best fits"
  matrix_heading: "Compare the decision dimensions"
  matrix_introduction: "Read each cell with its claim type, scope, and dated official evidence. A narrower workflow label means the behavior is documented for that included workflow, not automatically for the whole product."
  matrix_caption: "Hive, Agentico, and Omnigent across thirteen product and delivery dimensions"
  evidence_heading: "How to read the evidence"
  evidence_introduction: "The labels separate first-party documentation from this Hive-maintained page's interpretation. Verification dates say when the linked source was last checked; they are not release dates."
  sources_heading: "Official source register"
  excluded_heading: "What this page does not compare"
  excluded_introduction: "These topics need equivalent definitions and first-party evidence across all three products. Until that exists, a blank score would be less honest than leaving the category out."
  cta_heading: "Follow the boundary that fits"
  cta_introduction: "Start with the maintained path for the product you choose. Every route below goes directly to that product's first-party material."

claim_types:
  fact:
    label: "Sourced fact"
    description: "A capability or boundary stated directly in the linked first-party material."
  positioning_interpretation:
    label: "Positioning interpretation"
    description: "A best-fit or tradeoff conclusion drawn from the linked first-party material."
  hive_maintainer_inference:
    label: "Hive-maintainer inference"
    description: "A narrow inference made by the Hive maintainers and kept distinct from a product's own wording."

scopes:
  product:
    label: "Whole product"
    description: "The source describes the product or its primary supported surface."
  included_workflow:
    label: "Included workflow"
    description: "The source describes a named workflow bundled with the product, not every possible use of the platform."

products:
  - id: "hive"
    name: "Hive"
    short_name: "Hive"
    repository_identity: "ivankuznetsov/hive"
    identity: "Durable, local-first workflow engine for AI agents"
    best_fit:
      text: "Best fit when durable, user-authorable workflows and inspectable filesystem state matter more than a coding-only lifecycle."
      claim_type: "positioning_interpretation"
      scope: "product"
      source_ids: ["hive_repo", "hive_concepts", "hive_custom_workflows"]
    tradeoff:
      text: "The file-first model deliberately produces more intermediate artifacts, and the bundled coding workflow uses a longer staged path than a single agent session."
      claim_type: "fact"
      scope: "product"
      source_ids: ["hive_concepts"]
    links:
      getting_started:
        label: "Get started with Hive"
        url: "https://hivecli.sh/docs/getting-started/"
      documentation:
        label: "Read Hive docs"
        url: "https://hivecli.sh/docs/"
      source:
        label: "View Hive source"
        url: "https://github.com/ivankuznetsov/hive"

  - id: "agentico"
    name: "DoorDash Agentic Orchestrator"
    short_name: "Agentico"
    repository_identity: "doordash-oss/agentic-orchestrator"
    identity: "Feature-lifecycle orchestrator with a primary desktop workspace and the agentico CLI"
    best_fit:
      text: "Best fit for a specialized end-to-end software-feature lifecycle that builds context, validates plans, implements in worktrees, reviews, and publishes pull requests."
      claim_type: "positioning_interpretation"
      scope: "product"
      source_ids: ["agentico_repo", "agentico_announcement"]
    tradeoff:
      text: "Its documented center is the coding-feature lifecycle and a primary desktop workspace, rather than authoring arbitrary non-code workflow shapes."
      claim_type: "positioning_interpretation"
      scope: "product"
      source_ids: ["agentico_repo", "agentico_announcement"]
    links:
      getting_started:
        label: "Install Agentico"
        url: "https://github.com/doordash-oss/agentic-orchestrator#quick-start"
      source:
        label: "View Agentico source"
        url: "https://github.com/doordash-oss/agentic-orchestrator"

  - id: "omnigent"
    name: "Omnigent"
    short_name: "Omnigent"
    repository_identity: "omnigent-ai/omnigent"
    identity: "Open-source AI agent framework and meta-harness"
    best_fit:
      text: "Best fit when cross-harness governance, shared policy, and real-time collaboration matter across several agent runtimes."
      claim_type: "positioning_interpretation"
      scope: "product"
      source_ids: ["omnigent_repo", "omnigent_harnesses", "omnigent_policies", "omnigent_collaboration"]
    tradeoff:
      text: "The platform exposes a broader operator and configuration surface; its coding-specific delegation, worktree, and cross-review lifecycle belongs to Polly rather than every Omnigent agent."
      claim_type: "positioning_interpretation"
      scope: "product"
      source_ids: ["omnigent_repo", "omnigent_harnesses", "omnigent_polly"]
    links:
      getting_started:
        label: "Install Omnigent"
        url: "https://github.com/omnigent-ai/omnigent#quick-start"
      documentation:
        label: "Read Omnigent docs"
        url: "https://omnigent.ai/docs/"
      source:
        label: "View Omnigent source"
        url: "https://github.com/omnigent-ai/omnigent"

dimensions:
  - id: "product_scope"
    label: "Product scope"
  - id: "workflow_state"
    label: "Workflow and state"
  - id: "harnesses_providers"
    label: "Harnesses and providers"
  - id: "planning_review"
